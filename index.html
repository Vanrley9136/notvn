<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Anotações</title>
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tinymce-i18n@23.7.20/langs/pt_BR.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c0f;
            --surface: #101318;
            --surface-2: #161a21;
            --surface-3: #1c212a;
            --border: #2a2f38;
            --border-strong: #3a4150;
            --ink: #d5dae3;
            --ink-dim: #6c7480;
            --ink-faint: #454c58;
            --accent: #f0a83e;
            --accent-dim: rgba(240, 168, 62, 0.14);
            --ok: #4ade80;
            --ok-dim: rgba(74, 222, 128, 0.12);
            --danger: #ff5c5c;
            --danger-dim: rgba(255, 92, 92, 0.12);
            --radius: 6px;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-body);
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
                var(--bg);
            color: var(--ink);
            overflow: hidden;
        }

        .app {
            max-width: 1280px;
            height: 100vh;
            margin: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        /* ---------- topo ---------- */

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            flex-shrink: 0;
        }

        .topo-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .app-icone {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 4px;
            background: var(--surface-3);
            border: 1px solid var(--border-strong);
            color: var(--accent);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }

        .topo-textos h1 {
            margin: 0;
            font-family: var(--font-mono);
            color: var(--ink);
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.2px;
        }

        .topo-textos h1::after {
            content: '_';
            color: var(--accent);
            animation: piscar 1.1s step-end infinite;
        }

        .topo-textos p {
            margin: 4px 0 0;
            color: var(--ink-dim);
            font-size: 11.5px;
            font-family: var(--font-mono);
        }

        @keyframes piscar {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .topo-direita {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .acoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .usuario-card {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 10px 5px 5px;
            border-radius: var(--radius);
            background: var(--surface-2);
            border: 1px solid var(--border);
        }

        .avatar {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 4px;
            background: var(--accent);
            color: #1a1204;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 800;
        }

        .usuario-info {
            display: grid;
            line-height: 1.2;
        }

        .usuario-info strong {
            color: var(--ink);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-mono);
        }

        .usuario-info span {
            color: var(--ink-dim);
            font-size: 10px;
            font-family: var(--font-mono);
        }

        .status-online {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-online::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ok);
        }

        /* ---------- controles ---------- */

        input, select, button {
            font-family: var(--font-mono);
            border-radius: var(--radius);
            font-size: 13px;
            outline: none;
        }

        input, select {
            width: 100%;
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--border);
            padding: 9px 11px;
        }

        input::placeholder { color: var(--ink-faint); }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        select { cursor: pointer; }

        button {
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--ink);
            padding: 9px 14px;
            font-weight: 500;
            transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
        }

        button:hover { background: var(--surface-3); border-color: var(--border-strong); }
        button:active { transform: translateY(1px); }
        button:focus-visible { border-color: var(--accent); }

        .topo button {
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--border);
        }

        .topo button:first-child {
            background: var(--accent);
            color: #1a1204;
            border-color: var(--accent);
            font-weight: 700;
        }

        .topo button:first-child:hover { background: #f5b957; }

        .topo button.perigo {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--border);
        }

        .topo button.perigo:hover { background: var(--danger-dim); border-color: var(--danger); }

        button.secundario {
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--border);
        }

        button.perigo {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--border);
        }

        button.perigo:hover { background: var(--danger-dim); border-color: var(--danger); }

        /* ---------- layout ---------- */

        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 12px;
            min-height: 0;
            flex: 1;
        }

        .lista, .editor {
            border-radius: var(--radius);
            padding: 12px;
            min-height: 0;
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .lista {
            display: flex;
            flex-direction: column;
        }

        .editor {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .filtros {
            display: grid;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .filtros select { font-size: 12px; }

        .contador-notas {
            font-size: 10.5px;
            font-family: var(--font-mono);
            color: var(--ink-faint);
            margin-bottom: 10px;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .contador-notas::before { content: '// '; }

        .lista-scroll {
            overflow-y: auto;
            padding-right: 4px;
            flex: 1;
            min-height: 0;
        }

        .lista-scroll::-webkit-scrollbar { width: 6px; }

        .lista-scroll::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 20px;
        }

        /* nota entries — flat log-line style, no glow, no glass */

        .nota {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 11px 10px 13px;
            margin-bottom: 7px;
            cursor: pointer;
            background: var(--surface-2);
            border-left: 2px solid var(--border-strong);
            transition: background 0.12s ease, border-left-color 0.12s ease;
        }

        .nota:hover {
            background: var(--surface-3);
        }

        .nota.ativa {
            background: var(--surface-3);
            border-left: 2px solid var(--accent);
        }

        .nota-topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .nota-titulo {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 13.5px;
            color: var(--ink);
            margin-bottom: 3px;
            line-height: 1.35;
            word-break: break-word;
        }

        .nota-badge {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--ink-dim);
            background: var(--surface);
            border: 1px solid var(--border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .nota-data {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-faint);
        }

        .nota-resumo {
            margin-top: 6px;
            font-size: 11.5px;
            color: var(--ink-dim);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .vazio {
            padding: 20px 12px;
            color: var(--ink-faint);
            text-align: center;
            font-size: 12px;
            font-family: var(--font-mono);
            border: 1px dashed var(--border);
            border-radius: 4px;
            background: transparent;
        }

        .vazio::before { content: '/* '; }
        .vazio::after { content: ' */'; }

        /* ---------- editor ---------- */

        .campo {
            display: grid;
            gap: 6px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .campo label {
            font-size: 10.5px;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-faint);
            font-weight: 500;
        }

        .campo label::before { content: '# '; color: var(--ink-faint); }

        .campo input {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            padding: 10px 12px;
        }

        .campo input::placeholder { color: var(--ink-faint); font-weight: 400; }

        .campo input:focus { border-color: var(--accent); }

        .campo-editor {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .campo-editor .tox-tinymce {
            flex: 1 !important;
            min-height: 260px !important;
            border-radius: 4px !important;
            border-color: var(--border) !important;
            overflow: hidden;
        }

        .botoes-editor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .botoes-grupo {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .botoes-editor button {
            min-width: 96px;
            height: 38px;
            font-weight: 500;
        }

        .botao-salvar {
            background: var(--accent);
            color: #1a1204;
            min-width: 150px;
            font-weight: 700;
            border: 1px solid var(--accent);
        }

        .botao-salvar:hover { background: #f5b957; }

        /* ---------- toasts & modal ---------- */

        .toast-area {
            position: fixed;
            right: 16px;
            bottom: 16px;
            display: grid;
            gap: 8px;
            z-index: 99999;
        }

        .toast {
            min-width: 230px;
            background: var(--surface-3);
            color: var(--ink);
            border: 1px solid var(--border-strong);
            border-left: 2px solid var(--accent);
            border-radius: 4px;
            padding: 11px 13px;
            font-size: 12.5px;
            font-family: var(--font-mono);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            animation: toastEntrar 0.18s ease;
        }

        .toast.sucesso { border-left-color: var(--ok); }
        .toast.perigo { border-left-color: var(--danger); }
        .toast.info { border-left-color: var(--accent); }

        .modal-area {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 99998;
        }

        .modal-area.ativo { display: flex; }

        .modal {
            width: 100%;
            max-width: 370px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-left: 3px solid var(--danger);
            border-radius: 4px;
            padding: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: modalEntrar 0.16s ease;
        }

        .modal-icone {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 4px;
            background: var(--danger-dim);
            color: var(--danger);
            font-family: var(--font-mono);
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .modal h3 {
            margin: 0 0 6px;
            font-family: var(--font-mono);
            font-size: 15.5px;
            color: var(--ink);
        }

        .modal p {
            margin: 0;
            color: var(--ink-dim);
            font-size: 12.5px;
            line-height: 1.6;
        }

        .modal-botoes {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        @keyframes toastEntrar {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalEntrar {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ---------- responsivo ---------- */

        @media (max-width: 850px) {
            body { overflow: auto; }
            .app { height: auto; min-height: 100vh; }
            .layout { grid-template-columns: 1fr; }
            .lista-scroll { max-height: 320px; }
            .topo { align-items: flex-start; flex-direction: column; }
            .topo-direita { width: 100%; justify-content: space-between; }
            .acoes { width: 100%; }
            .acoes button { flex: 1; }
            .campo-editor .tox-tinymce { height: 420px !important; min-height: 420px !important; }
        }

        @media (max-width: 600px) {
            .botoes-editor { flex-direction: column; align-items: stretch; }
            .botoes-grupo { width: 100%; }
            .botoes-grupo button, .botao-salvar { flex: 1; width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <div class="topo">
            <div class="topo-info">
                <div class="app-icone">#</div>
                <div class="topo-textos">
                    <h1>Minhas Anotações</h1>
                    <p>Organize ideias, tarefas e registros em um só lugar</p>
                </div>
            </div>
            <div class="topo-direita">
                <div class="usuario-card">
                    <div class="avatar">VA</div>
                    <div class="usuario-info">
                        <strong>Vanrley</strong>
                        <span class="status-online">Online</span>
                    </div>
                </div>
                <div class="acoes">
                    <button onclick="novaNota ( )">Nova nota</button>
                    <button class="perigo" onclick="confirmarExcluirTudo ( )">Excluir tudo</button>
                </div>
            </div>
        </div>

        <div class="layout">

            <div class="lista">
                <div class="filtros">
                    <input type="text" id="buscar" placeholder="Filtrar notas..." oninput="renderizarNotas ( )">
                    <select id="ordenar" onchange="renderizarNotas ( )">
                        <option value="recente">Mais recentes</option>
                        <option value="antiga">Mais antigas</option>
                        <option value="az">Título A-Z</option>
                        <option value="za">Título Z-A</option>
                    </select>
                </div>
                <div class="contador-notas" id="contadorNotas">0 notas encontradas</div>
                <div class="lista-scroll" id="listaNotas"></div>
            </div>

            <div class="editor">
                <div class="campo">
                    <label>Título</label>
                    <input type="text" id="tituloNota" placeholder="Digite o título da nota">
                </div>
                <div class="campo campo-editor">
                    <label>Anotação</label>
                    <textarea id="conteudoNota"></textarea>
                </div>
                <div class="botoes-editor">
                    <div class="botoes-grupo">
                        <button class="secundario" onclick="limparEditor ( )">Limpar</button>
                        <button class="perigo" onclick="confirmarExcluirNota ( )">Excluir</button>
                    </div>
                    <button class="botao-salvar" onclick="salvarNota ( )">Salvar nota</button>
                </div>
            </div>

        </div>

    </div>

    <div class="toast-area" id="toastArea"></div>

    <div class="modal-area" id="modalArea">
        <div class="modal">
            <div class="modal-icone">!</div>
            <h3 id="modalTitulo">Excluir nota?</h3>
            <p id="modalTexto">Essa ação vai apagar a nota selecionada de forma permanente.</p>
            <div class="modal-botoes">
                <button class="secundario" onclick="fecharModal ( )">Cancelar</button>
                <button class="perigo" id="modalConfirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <script>

        let notas = JSON.parse ( localStorage.getItem ( 'notas' ) || '[ ]' );

        let notaAtual = null;

        let acaoConfirmada = null;



        tinymce.init ( {

            selector: '#conteudoNota',

            height: '100%',

            resize: false,

            menubar: true,

            branding: false,

            promotion: false,

            language: 'pt_BR',

            plugins: 'preview searchreplace autolink autosave directionality code visualblocks visualchars fullscreen image link media table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help quickbars emoticons',

            toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough forecolor backcolor | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image media table | charmap emoticons | removeformat | fullscreen preview code',

            toolbar_mode: 'sliding',

            quickbars_selection_toolbar: 'bold italic underline | quicklink h2 h3 blockquote',

            quickbars_insert_toolbar: 'quickimage quicktable',

            contextmenu: 'link image table',

            image_title: true,

            automatic_uploads: true,

            file_picker_types: 'image',

            table_toolbar: 'tableprops tabledelete | tableinsertrowbefore tableinsertrowafter tabledeleterow | tableinsertcolbefore tableinsertcolafter tabledeletecol',

            autosave_ask_before_unload: true,

            autosave_interval: '20s',

            autosave_retention: '30m',

            content_style: `

                body {
                    font-family: Poppins, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.7;
                    color: #111827;
                }

                img {
                    max-width: 100%;
                    height: auto;
                }

            `

        } );



        function toast ( msg, tipo = 'info' ) {

            let el = document.createElement ( 'div' );

            el.className = 'toast ' + tipo;

            el.innerText = msg;

            document.getElementById ( 'toastArea' ).appendChild ( el );

            setTimeout ( ( ) => {

                el.remove ( );

            }, 2600 );

        }



        function abrirModal ( titulo, texto, callback ) {

            acaoConfirmada = callback;

            document.getElementById ( 'modalTitulo' ).innerText = titulo;

            document.getElementById ( 'modalTexto' ).innerText = texto;

            document.getElementById ( 'modalArea' ).classList.add ( 'ativo' );

        }



        function fecharModal ( ) {

            acaoConfirmada = null;

            document.getElementById ( 'modalArea' ).classList.remove ( 'ativo' );

        }



        document.getElementById ( 'modalConfirmar' ).addEventListener ( 'click', function ( ) {

            if ( typeof acaoConfirmada == 'function' ) {

                acaoConfirmada ( );

            }

            fecharModal ( );

        } );



        document.getElementById ( 'modalArea' ).addEventListener ( 'click', function ( e ) {

            if ( e.target.id == 'modalArea' ) {

                fecharModal ( );

            }

        } );



        function salvarLocal ( ) {

            localStorage.setItem ( 'notas', JSON.stringify ( notas ) );

        }



        function novaNota ( ) {

            notaAtual = null;

            document.getElementById ( 'tituloNota' ).value = '';

            tinymce.get ( 'conteudoNota' ).setContent ( '' );

            renderizarNotas ( );

            toast ( 'Nova nota iniciada', 'info' );

        }



        function limparEditor ( ) {

            document.getElementById ( 'tituloNota' ).value = '';

            tinymce.get ( 'conteudoNota' ).setContent ( '' );

            toast ( 'Editor limpo', 'info' );

        }



        function salvarNota ( ) {

            let titulo = document.getElementById ( 'tituloNota' ).value.trim ( );

            let conteudo = tinymce.get ( 'conteudoNota' ).getContent ( );

            let criando = notaAtual == null;

            if ( titulo == '' ) {

                titulo = 'Sem título';

            }

            if ( criando ) {

                let id = Date.now ( );

                notas.push ( {

                    id: id,

                    titulo: titulo,

                    conteudo: conteudo,

                    criadaEm: new Date ( ).toISOString ( ),

                    atualizadaEm: new Date ( ).toISOString ( )

                } );

                notaAtual = id;

            } else {

                notas = notas.map ( nota => {

                    if ( nota.id == notaAtual ) {

                        nota.titulo = titulo;

                        nota.conteudo = conteudo;

                        nota.atualizadaEm = new Date ( ).toISOString ( );

                    }

                    return nota;

                } );

            }

            salvarLocal ( );

            renderizarNotas ( );

            toast ( criando ? 'Nota adicionada com sucesso' : 'Nota salva com sucesso', 'sucesso' );

        }



        function editarNota ( id ) {

            let nota = notas.find ( item => item.id == id );

            if ( ! nota ) {

                return;

            }

            notaAtual = id;

            document.getElementById ( 'tituloNota' ).value = nota.titulo;

            tinymce.get ( 'conteudoNota' ).setContent ( nota.conteudo );

            renderizarNotas ( );

        }



        function confirmarExcluirNota ( ) {

            if ( notaAtual == null ) {

                toast ( 'Selecione uma nota para excluir', 'info' );

                return;

            }

            abrirModal (

                'Excluir nota?',

                'Essa ação vai apagar a nota selecionada de forma permanente.',

                function ( ) {

                    excluirNota ( );

                }

            );

        }



        function excluirNota ( ) {

            notas = notas.filter ( nota => nota.id != notaAtual );

            notaAtual = null;

            salvarLocal ( );

            limparEditor ( );

            renderizarNotas ( );

            toast ( 'Nota excluída com sucesso', 'perigo' );

        }



        function confirmarExcluirTudo ( ) {

            if ( notas.length == 0 ) {

                toast ( 'Você ainda não tem notas para excluir', 'info' );

                return;

            }

            abrirModal (

                'Excluir todas as notas?',

                'Todas as suas anotações serão apagadas definitivamente.',

                function ( ) {

                    excluirTudo ( );

                }

            );

        }



        function excluirTudo ( ) {

            notas = [ ];

            notaAtual = null;

            salvarLocal ( );

            limparEditor ( );

            renderizarNotas ( );

            toast ( 'Todas as notas foram excluídas', 'perigo' );

        }



        function textoLimpo ( html ) {

            let div = document.createElement ( 'div' );

            div.innerHTML = html;

            return div.textContent || div.innerText || '';

        }



        function renderizarNotas ( ) {

            let busca = document.getElementById ( 'buscar' ).value.toLowerCase ( );

            let ordem = document.getElementById ( 'ordenar' ).value;

            let lista = [ ...notas ];

            lista = lista.filter ( nota => {

                let titulo = ( nota.titulo || '' ).toLowerCase ( );

                let conteudo = textoLimpo ( nota.conteudo || '' ).toLowerCase ( );

                return titulo.includes ( busca ) || conteudo.includes ( busca );

            } );

            lista.sort ( ( a, b ) => {

                let dataA = new Date ( a.atualizadaEm || a.data || a.criadaEm || 0 );

                let dataB = new Date ( b.atualizadaEm || b.data || b.criadaEm || 0 );

                if ( ordem == 'recente' ) {

                    return dataB - dataA;

                }

                if ( ordem == 'antiga' ) {

                    return dataA - dataB;

                }

                if ( ordem == 'az' ) {

                    return ( a.titulo || '' ).localeCompare ( b.titulo || '' );

                }

                if ( ordem == 'za' ) {

                    return ( b.titulo || '' ).localeCompare ( a.titulo || '' );

                }

                return 0;

            } );

            document.getElementById ( 'contadorNotas' ).innerText = lista.length == 1 ? '1 nota encontrada' : lista.length + ' notas encontradas';

            let html = '';

            if ( lista.length == 0 ) {

                html = '<div class="vazio">Nenhuma nota encontrada</div>';

            }

            lista.forEach ( nota => {

                let ativo = nota.id == notaAtual ? 'ativa' : '';

                let dataBase = nota.atualizadaEm || nota.data || nota.criadaEm;

                let data = dataBase ? new Date ( dataBase ).toLocaleString ( 'pt-BR' ) : '';

                let resumo = textoLimpo ( nota.conteudo || '' ).slice ( 0, 110 );

                html += `

                    <div class="nota ${ ativo }" onclick="editarNota ( ${ nota.id } )">

                        <div class="nota-topo">

                            <div class="nota-titulo">${ nota.titulo }</div>

                            <div class="nota-badge">nota</div>

                        </div>

                        <div class="nota-data">${ data }</div>

                        <div class="nota-resumo">${ resumo || 'Sem conteúdo ainda...' }</div>

                    </div>

                `;

            } );

            document.getElementById ( 'listaNotas' ).innerHTML = html;

        }



        renderizarNotas ( );

    </script>

</body>
</html>
